<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollinations AI Agent - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 0; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        #chat-history { max-height: 400px; overflow-y: auto; }
        .result-img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="hero text-center">
        <div class="container">
            <h1 class="display-4"><i class="fas fa-robot"></i> Pollinations AI Agent</h1>
            <p class="lead">Professional AI Platform for Image, Text, Audio Generation & Chat</p>
            <a href="/api-docs" class="btn btn-light btn-lg me-3">API Docs</a>
            <a href="https://atlas-e7ck.onrender.com/api/" class="btn btn-outline-light btn-lg">API Root</a>
        </div>
    </div>

    <div class="container my-5">
        <div class="row">
            <!-- Chat Section -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5><i class="fas fa-comments"></i> AI Chat Agent</h5>
                    </div>
                    <div class="card-body">
                        <div id="chat-history" class="border p-3 mb-3 bg-light rounded"></div>
                        <div class="input-group">
                            <input type="text" id="chat-input" class="form-control" placeholder="Ask the agent (e.g., 'Generate an image of a cat')">
                            <button class="btn btn-primary" onclick="sendChat()"><i class="fas fa-paper-plane"></i> Send</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Image Generation -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5><i class="fas fa-image"></i> Generate Image</h5>
                    </div>
                    <div class="card-body">
                        <input type="text" id="image-prompt" class="form-control mb-2" placeholder="Prompt (e.g., 'a cat')">
                        <button class="btn btn-success w-100" onclick="generateImage()">Generate</button>
                        <div id="image-result" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Text Generation -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5><i class="fas fa-file-alt"></i> Generate Text</h5>
                    </div>
                    <div class="card-body">
                        <input type="text" id="text-prompt" class="form-control mb-2" placeholder="Prompt (e.g., 'hello')">
                        <button class="btn btn-info w-100 text-white" onclick="generateText()">Generate</button>
                        <div id="text-result" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Audio Generation -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-warning text-white">
                        <h5><i class="fas fa-volume-up"></i> Generate Audio</h5>
                    </div>
                    <div class="card-body">
                        <input type="text" id="audio-prompt" class="form-control mb-2" placeholder="Prompt (e.g., 'hello')">
                        <input type="text" id="audio-voice" class="form-control mb-2" placeholder="Voice (default: alloy)">
                        <button class="btn btn-warning w-100 text-white" onclick="generateAudio()">Generate</button>
                        <div id="audio-result" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Models -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5><i class="fas fa-cogs"></i> Available Models</h5>
                    </div>
                    <div class="card-body">
                        <select id="model-type" class="form-select mb-2">
                            <option value="text">Text</option>
                            <option value="image">Image</option>
                        </select>
                        <button class="btn btn-secondary w-100" onclick="getModels()">Fetch Models</button>
                        <pre id="models-result" class="mt-3 bg-light p-2 rounded small"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let sessionId = 'default';

        async function apiCall(url, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(url, options);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        function updateResult(id, content, type = 'text') {
            const el = document.getElementById(id);
            if (type === 'image') {
                el.innerHTML = `<img src="${content.image_url}" class="result-img" alt="Generated Image">`;
            } else if (type === 'audio') {
                el.innerHTML = `<audio controls><source src="${content.audio_url}" type="audio/mpeg"></audio>`;
            } else {
                el.textContent = JSON.stringify(content, null, 2);
            }
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const query = input.value.trim();
            if (!query) return;
            const history = document.getElementById('chat-history');
            history.innerHTML += `<div class="mb-2"><strong>You:</strong> ${query}</div>`;
            input.value = '';
            try {
                const res = await apiCall('/api/chat', 'POST', { query, session_id: sessionId });
                history.innerHTML += `<div class="mb-2"><strong>Agent:</strong> ${res.response}</div>`;
                history.scrollTop = history.scrollHeight;
            } catch (e) {
                history.innerHTML += `<div class="text-danger mb-2"><strong>Error:</strong> ${e.message}</div>`;
            }
        }

        async function generateImage() {
            const prompt = document.getElementById('image-prompt').value.trim();
            if (!prompt) return;
            try {
                const res = await apiCall(`/api/generate/image?prompt=${encodeURIComponent(prompt)}`);
                updateResult('image-result', res, 'image');
            } catch (e) {
                document.getElementById('image-result').innerHTML = `<p class="text-danger">Error: ${e.message}</p>`;
            }
        }

        async function generateText() {
            const prompt = document.getElementById('text-prompt').value.trim();
            if (!prompt) return;
            try {
                const res = await apiCall(`/api/generate/text?prompt=${encodeURIComponent(prompt)}`);
                updateResult('text-result', res);
            } catch (e) {
                document.getElementById('text-result').innerHTML = `<p class="text-danger">Error: ${e.message}</p>`;
            }
        }

        async function generateAudio() {
            const prompt = document.getElementById('audio-prompt').value.trim();
            const voice = document.getElementById('audio-voice').value.trim() || 'alloy';
            if (!prompt) return;
            try {
                const res = await apiCall(`/api/generate/audio?prompt=${encodeURIComponent(prompt)}&voice=${voice}`);
                updateResult('audio-result', res, 'audio');
            } catch (e) {
                document.getElementById('audio-result').innerHTML = `<p class="text-danger">Error: ${e.message}</p>`;
            }
        }

        async function getModels() {
            const type = document.getElementById('model-type').value;
            try {
                const res = await apiCall(`/api/models/${type}`);
                document.getElementById('models-result').textContent = res.result;
            } catch (e) {
                document.getElementById('models-result').innerHTML = `<p class="text-danger">Error: ${e.message}</p>`;
            }
        }

        // Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.activeElement.id === 'chat-input') sendChat();
            }
        });
    </script>
</body>
</html>
